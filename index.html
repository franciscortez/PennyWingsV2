<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/pennywings-logo.png" />
    <link rel="apple-touch-icon" href="/pennywings-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Penny Wings</title>
    <meta property="og:image" content="/pennywings-logo.png" />
    <script>
      ;(() => {
        try {
          const publicPaths = new Set([
            '/',
            '/forgot-password',
            '/login',
            '/register',
            '/reset-password',
            '/signup',
            '/terms-and-conditions',
          ])
          const isPublicPath = publicPaths.has(window.location.pathname)
          const savedTheme = localStorage.getItem('theme')
          const prefersDark = window.matchMedia(
            '(prefers-color-scheme: dark)',
          ).matches
          const theme =
            isPublicPath
              ? 'light'
              : savedTheme === 'light' || savedTheme === 'dark'
              ? savedTheme
              : prefersDark
                ? 'dark'
                : 'light'

          document.documentElement.classList.toggle('dark', theme === 'dark')
          document.documentElement.style.colorScheme = theme
        } catch {
          document.documentElement.classList.remove('dark')
          document.documentElement.style.colorScheme = 'light'
        }
      })()
    </script>
    <style>
      :root {
        background: #fff0f5;
      }

      html.dark {
        background: #020617;
      }

      body {
        margin: 0;
        min-width: 320px;
        background: #fff0f5;
      }

      html.dark body {
        background: #020617;
      }

      #root {
        min-height: 100vh;
        min-height: 100svh;
      }

      .initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 16px;
        box-sizing: border-box;
        background: #fff0f5;
        color: #ff7a93;
      }

      html.dark .initial-loader {
        background: #020617;
        color: #f472b6;
      }

      .initial-loader__mark {
        width: 160px;
        height: 112px;
        margin-bottom: 24px;
        object-fit: contain;
        animation: initial-loader-bounce 1000ms infinite;
      }

      .initial-loader__dots {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .initial-loader__dot {
        width: 12px;
        height: 12px;
        border-radius: 999px;
        animation: initial-loader-pulse 2000ms cubic-bezier(0.4, 0, 0.6, 1)
          infinite;
      }

      .initial-loader__dot--one {
        background: #ff9ead;
        animation-delay: 0ms;
      }

      html.dark .initial-loader__dot--one {
        background: #ec4899;
      }

      .initial-loader__dot--two {
        background: #ff7a93;
        animation-delay: 150ms;
      }

      html.dark .initial-loader__dot--two {
        background: #f472b6;
      }

      .initial-loader__dot--three {
        background: #e85d7a;
        animation-delay: 300ms;
      }

      html.dark .initial-loader__dot--three {
        background: #f9a8d4;
      }

      @keyframes initial-loader-bounce {
        0%,
        100% {
          transform: translateY(-25%);
          animation-timing-function: cubic-bezier(0.8, 0, 1, 1);
        }

        50% {
          transform: translateY(0);
          animation-timing-function: cubic-bezier(0, 0, 0.2, 1);
        }
      }

      @keyframes initial-loader-pulse {
        50% {
          opacity: 0.5;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="initial-loader" aria-label="Loading PennyWings">
        <img
          class="initial-loader__mark"
          src="/pennywings-logo.png"
          width="1254"
          height="854"
          alt=""
          aria-hidden="true"
        />
        <div class="initial-loader__dots">
          <span class="initial-loader__dot initial-loader__dot--one"></span>
          <span class="initial-loader__dot initial-loader__dot--two"></span>
          <span class="initial-loader__dot initial-loader__dot--three"></span>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
