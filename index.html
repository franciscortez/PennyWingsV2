<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pennywingsv2</title>
    <script>
      ;(() => {
        try {
          const savedTheme = localStorage.getItem('theme')
          const prefersDark = window.matchMedia(
            '(prefers-color-scheme: dark)',
          ).matches
          const theme =
            savedTheme === 'light' || savedTheme === 'dark'
              ? savedTheme
              : prefersDark
                ? 'dark'
                : 'light'

          document.documentElement.classList.toggle('dark', theme === 'dark')
          document.documentElement.style.colorScheme = theme
        } catch {
          document.documentElement.classList.remove('dark')
          document.documentElement.style.colorScheme = 'light'
        }
      })()
    </script>
    <style>
      :root {
        background: #fff0f5;
      }

      html.dark {
        background: #020617;
      }

      body {
        margin: 0;
        min-width: 320px;
        background: #fff0f5;
      }

      html.dark body {
        background: #020617;
      }

      #root {
        min-height: 100vh;
        min-height: 100svh;
      }

      .initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 16px;
        box-sizing: border-box;
        background: #fff0f5;
        color: #ff7a93;
      }

      html.dark .initial-loader {
        background: #020617;
        color: #f472b6;
      }

      .initial-loader__mark {
        width: 96px;
        height: 96px;
        margin-bottom: 24px;
        color: #ff7a93;
        animation: initial-loader-bounce 1000ms infinite;
      }

      .initial-loader__dots {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .initial-loader__dot {
        width: 12px;
        height: 12px;
        border-radius: 999px;
        animation: initial-loader-pulse 2000ms cubic-bezier(0.4, 0, 0.6, 1)
          infinite;
      }

      .initial-loader__dot--one {
        background: #ff9ead;
        animation-delay: 0ms;
      }

      html.dark .initial-loader__dot--one {
        background: #ec4899;
      }

      .initial-loader__dot--two {
        background: #ff7a93;
        animation-delay: 150ms;
      }

      html.dark .initial-loader__dot--two {
        background: #f472b6;
      }

      .initial-loader__dot--three {
        background: #e85d7a;
        animation-delay: 300ms;
      }

      html.dark .initial-loader__dot--three {
        background: #f9a8d4;
      }

      @keyframes initial-loader-bounce {
        0%,
        100% {
          transform: translateY(-25%);
          animation-timing-function: cubic-bezier(0.8, 0, 1, 1);
        }

        50% {
          transform: translateY(0);
          animation-timing-function: cubic-bezier(0, 0, 0.2, 1);
        }
      }

      @keyframes initial-loader-pulse {
        50% {
          opacity: 0.5;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="initial-loader" aria-label="Loading PennyWings">
        <svg
          class="initial-loader__mark"
          viewBox="0 0 100 100"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
        >
          <path d="M 48 20 C 40 10 30 15 35 20" stroke="currentColor" stroke-width="2" fill="none"></path>
          <path d="M 52 20 C 60 10 70 15 65 20" stroke="currentColor" stroke-width="2" fill="none"></path>
          <path d="M 48 30 C 20 -5 0 20 15 45 C 0 65 20 95 48 65 Z" fill="currentColor" fill-opacity="0.4" stroke="currentColor" stroke-width="2"></path>
          <path d="M 52 30 C 80 -5 100 20 85 45 C 100 65 80 95 52 65 Z" fill="currentColor" fill-opacity="0.4" stroke="currentColor" stroke-width="2"></path>
          <circle cx="25" cy="30" r="3" fill="currentColor" fill-opacity="0.2"></circle>
          <circle cx="75" cy="30" r="3" fill="currentColor" fill-opacity="0.2"></circle>
          <rect x="47" y="20" width="6" height="45" rx="3" fill="currentColor"></rect>
          <circle cx="50" cy="18" r="4" fill="currentColor"></circle>
        </svg>
        <div class="initial-loader__dots">
          <span class="initial-loader__dot initial-loader__dot--one"></span>
          <span class="initial-loader__dot initial-loader__dot--two"></span>
          <span class="initial-loader__dot initial-loader__dot--three"></span>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
